<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge curation — three stages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&family=Inter:opsz,wght@14..32,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
  <link rel="stylesheet" href="../static/css/main-anim.css">
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : '';
      document.documentElement.setAttribute('data-theme', saved !== null ? saved : preferred);
    })();
  </script>
  <style>
    body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); }
    .fbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; height: 44px; padding: 0 1.1rem; border-bottom: 1px solid var(--color-border-light); }
    .fbar a { font-size: .85rem; font-weight: 600; color: var(--color-accent-hover); text-decoration: none; }
    [data-theme="dark"] .fbar a { color: var(--color-accent); }
    .fbar .ttl { font-size: .82rem; color: var(--color-text-secondary); }
    .fstage { padding: 1.5rem 1rem 3rem; }
  </style>
</head>
<body>
  <div class="fbar"><a href="../">← All figures</a><span class="ttl">Knowledge curation · three stages</span></div>
  <main class="fstage">
    <figure class="stages-wrap" aria-describedby="stages-anim-desc">
      <div class="stages-bar">
        <div class="stages-tabs" role="tablist" aria-label="Protocol stage">
          <button class="fig-tab stage-tab is-active" data-stage="0" role="tab" aria-selected="true"><span class="stage-tab-num">1</span>Task forum<span class="stage-progress" aria-hidden="true"><i></i></span></button>
          <button class="fig-tab stage-tab" data-stage="1" role="tab" aria-selected="false"><span class="stage-tab-num">2</span>Cross-task forum<span class="stage-progress" aria-hidden="true"><i></i></span></button>
          <button class="fig-tab stage-tab" data-stage="2" role="tab" aria-selected="false"><span class="stage-tab-num">3</span>Distillation<span class="stage-progress" aria-hidden="true"><i></i></span></button>
          <button class="fig-tab stage-tab" data-stage="3" role="tab" aria-selected="false"><span class="stage-tab-num">4</span>Results<span class="stage-progress" aria-hidden="true"><i></i></span></button>
        </div>
        <div class="stages-playback">
          <button class="stages-btn" data-act="playpause" aria-label="Pause">&#9208;</button>
          <button class="stages-btn" data-act="restart" aria-label="Restart from stage 1">&#8635;</button>
          <span class="stages-speed" role="group" aria-label="Playback speed">
            <button class="stages-speed-btn" data-speed="0.5">0.5&times;</button>
            <button class="stages-speed-btn is-active" data-speed="1">1&times;</button>
            <button class="stages-speed-btn" data-speed="2">2&times;</button>
          </span>
        </div>
      </div>
      <div class="stages-substeps" role="tablist" aria-label="Sub-step"></div>
      <p class="stages-caption" aria-live="polite"></p>
      <div class="main-anim" id="stages-anim"></div>
      <p id="stages-anim-desc" class="sr-only">Three-stage knowledge-curation walkthrough: task forum, cross-task forum, distillation.</p>
      <figcaption><strong>One insight, three stages.</strong> Click a stage tab to focus it, or play through all three. Hover-free playback controls above.</figcaption>
    </figure>
  </main>
  <script src="../static/js/stages-anim.js"></script>
</body>
</html>
