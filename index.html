<!DOCTYPE html>
<html lang="en" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursive Knowledge</title>
  <meta name="description" content="Recursive Knowledge — research on knowledge-centric self-improvement for agentic systems.">
  <link rel="canonical" href="https://recursive-knowledge.github.io/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23c45e3b' stroke-width='2'/%3E%3Ccircle cx='5' cy='6' r='2.5' fill='%23c45e3b'/%3E%3Ccircle cx='27' cy='6' r='2.5' fill='%23c45e3b'/%3E%3Ccircle cx='5' cy='26' r='2.5' fill='%23c45e3b'/%3E%3Ccircle cx='27' cy='26' r='2.5' fill='%23c45e3b'/%3E%3Cline x1='7' y1='8' x2='12' y2='13' stroke='%23c45e3b' stroke-width='1.4'/%3E%3Cline x1='25' y1='8' x2='20' y2='13' stroke='%23c45e3b' stroke-width='1.4'/%3E%3Cline x1='7' y1='24' x2='12' y2='19' stroke='%23c45e3b' stroke-width='1.4'/%3E%3Cline x1='25' y1='24' x2='20' y2='19' stroke='%23c45e3b' stroke-width='1.4'/%3E%3C/svg%3E">
  <script>
    // Mirror the blog's theme init so a light/dark choice carries across pages.
    (function() {
      var root = document.documentElement;
      var saved = localStorage.getItem('theme');
      var preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : '';
      root.setAttribute('data-theme', saved !== null ? saved : preferred);
    })();
  </script>
  <style>
    /* Palette + type pulled from the blog (static/css/style.css) so the org
       landing reads as the same site. */
    :root {
      --color-bg:             #faf9f5;
      --color-text:           #1d1c1a;
      --color-text-secondary: #5e5b54;
      --color-accent:         #c45e3b;
      --color-accent-hover:   #a64a2b;
      --color-border:         #e7e3d8;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    [data-theme="dark"] {
      --color-bg:             #181612;
      --color-text:           #e9e7e2;
      --color-text-secondary: #a3a09a;
      --color-accent:         #e58a5f;
      --color-accent-hover:   #f0a07d;
      --color-border:         #2e2a22;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.6rem;
      padding: 2rem;
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .mark { width: 68px; height: 68px; }

    h1 {
      margin: 0;
      font-weight: 600;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.01em;
      text-align: center;
    }

    .tagline {
      margin: -0.6rem 0 0;
      max-width: 34ch;
      text-align: center;
      color: var(--color-text-secondary);
      font-size: 1rem;
      line-height: 1.5;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      justify-content: center;
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }
    .links a {
      color: var(--color-accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .links a:hover,
    .links a:focus-visible {
      color: var(--color-accent-hover);
      border-bottom-color: currentColor;
    }
  </style>
</head>
<body>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="6" fill="none" stroke="var(--color-accent)" stroke-width="2"/>
    <circle cx="5" cy="6" r="2.5" fill="var(--color-accent)"/>
    <circle cx="27" cy="6" r="2.5" fill="var(--color-accent)"/>
    <circle cx="5" cy="26" r="2.5" fill="var(--color-accent)"/>
    <circle cx="27" cy="26" r="2.5" fill="var(--color-accent)"/>
    <line x1="7" y1="8" x2="12" y2="13" stroke="var(--color-accent)" stroke-width="1.4"/>
    <line x1="25" y1="8" x2="20" y2="13" stroke="var(--color-accent)" stroke-width="1.4"/>
    <line x1="7" y1="24" x2="12" y2="19" stroke="var(--color-accent)" stroke-width="1.4"/>
    <line x1="25" y1="24" x2="20" y2="19" stroke="var(--color-accent)" stroke-width="1.4"/>
  </svg>

  <h1>recursive knowledge</h1>
  <p class="tagline">Knowledge-centric self-improvement for agentic systems.</p>

  <nav class="links" aria-label="Projects">
    <a href="./knowledge-centric-self-improvement/">Knowledge-Centric Self-Improvement</a>
  </nav>
</body>
</html>
