<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recursive Knowledge</title>
  <meta name="description" content="Recursive Knowledge — research on self-improving agentic systems.">
  <link rel="canonical" href="https://recursive-knowledge.github.io/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23c45e3b' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23c45e3b' stroke-width='2' opacity='0.55'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23c45e3b'/%3E%3C/svg%3E">
  <script>
    // Mirror the blog's theme init so a light/dark choice carries across pages.
    (function() {
      var root = document.documentElement;
      var saved = localStorage.getItem('theme');
      var preferred = 'dark';  // dark is the site default; a saved choice still wins
      root.setAttribute('data-theme', saved !== null ? saved : preferred);
    })();

    // Restored with the floating toggle: the header that used to own this
    // lived in 5e68140 and took the handler with it.
    function toggleTheme() {
      var root = document.documentElement;
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
  </script>
  <style>
    /* Palette + type pulled from the blog (static/css/style.css) so the org
       landing reads as the same site. */
    :root {
      --color-bg:             #faf9f5;
      --color-text:           #1d1c1a;
      --color-text-secondary: #5e5b54;
      --color-accent:         #c45e3b;
      --color-accent-hover:   #a64a2b;
      --color-border:         #e7e3d8;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    [data-theme="dark"] {
      --color-bg:             #181612;
      --color-text:           #e9e7e2;
      --color-text-secondary: #a3a09a;
      --color-accent:         #e58a5f;
      --color-accent-hover:   #f0a07d;
      --color-border:         #2e2a22;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.6rem;
      padding: 2rem;
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s ease, color 0.2s ease;
    }

    /* Mirrors .theme-toggle in the blog's style.css, which this page does not
       load. Keep the two in sync if either changes. */
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 50;
      background: none;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 6px;
      cursor: pointer;
      color: var(--color-text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.25s ease, border-color 0.25s ease;
    }
    .theme-toggle:hover { color: var(--color-accent); border-color: var(--color-accent); }
    .theme-toggle svg { width: 20px; height: 20px; }
    .icon-sun { display: none; }
    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun  { display: block; }

    .mark { width: 68px; height: 68px; }

    h1 {
      margin: 0;
      font-weight: 600;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.01em;
      text-align: center;
    }

    .projects {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      margin-top: 1.2rem;
      padding-top: 1.4rem;
      border-top: 1px solid var(--color-border);
      text-align: center;
    }
    .projects-title {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-secondary);
    }
    .projects a {
      color: var(--color-accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 1px;
      font-size: 1.05rem;
      font-weight: 500;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .projects a:hover,
    .projects a:focus-visible {
      color: var(--color-accent-hover);
      border-bottom-color: currentColor;
    }
    .project-desc {
      margin: 0;
      max-width: 44ch;
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--color-text-secondary);
    }
  </style>
</head>
<body>

  <button class="theme-toggle" type="button" aria-label="Toggle light and dark theme" onclick="toggleTheme()">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <circle cx="16" cy="16" r="13" fill="none" stroke="var(--color-accent)" stroke-width="2"/>
    <circle cx="16" cy="16" r="8" fill="none" stroke="var(--color-accent)" stroke-width="2" opacity="0.55"/>
    <circle cx="16" cy="16" r="3.2" fill="var(--color-accent)"/>
  </svg>

  <h1>recursive knowledge</h1>

  <nav class="projects" aria-label="Projects">
    <p class="projects-title">Projects</p>
    <a href="./knowledge-centric-self-improvement/">Knowledge-Centric Self-Improvement</a>
    <p class="project-desc">Stock agents, thrown away after one task, build a shared knowledge base that outlasts them.</p>
  </nav>
</body>
</html>
